<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitCity</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #e9eef2;
        --fg: #1d2630;
        --panel: rgba(255, 255, 255, 0.85);
        --ribbon-unloaded: rgba(29, 38, 48, 0.05);
        --ribbon-loaded: rgba(29, 38, 48, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10161c;
          --fg: #dde5ec;
          --panel: rgba(24, 32, 40, 0.85);
          --ribbon-unloaded: rgba(221, 229, 236, 0.06);
          --ribbon-loaded: rgba(221, 229, 236, 0.26);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #player {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 16px 10px;
        background: var(--panel);
      }
      #player button {
        font: inherit;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      #player button[aria-pressed="true"] {
        font-weight: 600;
        text-decoration: underline;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      .readout {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .caption {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.8;
      }
      .speeds {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .track {
        position: relative;
        height: 56px;
      }
      .track:focus-within {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }
      #ribbon {
        width: 100%;
        height: 56px;
      }
      #scrubber {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: ew-resize;
      }
      .tooltip {
        position: absolute;
        bottom: 100%;
        margin-bottom: 6px;
        transform: translateX(-50%);
        max-width: 280px;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--panel);
        pointer-events: none;
        font-size: 12px;
      }
      .tooltip .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 2px;
        vertical-align: -1px;
      }
      .status {
        min-height: 1.4em;
        font-size: 12px;
        opacity: 0.8;
      }
      #notice {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      #notice code {
        user-select: all;
      }
      .labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .district-label {
        padding: 2px 8px;
        border-left: 4px solid;
        border-radius: 4px;
        background: var(--panel);
        white-space: nowrap;
        transform: translate(-50%, -100%);
      }
      .district-label small {
        display: block;
        opacity: 0.7;
        font-size: 11px;
      }
      .legend {
        position: fixed;
        top: 16px;
        right: 16px;
        display: grid;
        gap: 4px;
        max-width: min(260px, calc(100vw - 32px));
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel);
      }
      .legend-entry {
        display: flex;
        gap: 8px;
        align-items: center;
        font: inherit;
        text-align: left;
        background: none;
        border: 0;
        padding: 2px 0;
        color: inherit;
        cursor: pointer;
      }
      .legend-entry[aria-pressed="true"] {
        font-weight: 600;
      }
      .legend-entry .swatch {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .legend-more {
        margin: 0;
        opacity: 0.7;
      }
      .commit-caption {
        position: fixed;
        left: 16px;
        bottom: 64px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 4px 10px;
        border-radius: 6px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      @media (max-width: 640px) {
        .caption {
          display: none;
        }
      }
      .postcard {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 8px;
        background: var(--panel);
        pointer-events: none;
        white-space: nowrap;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="notice" hidden></div>
    <aside id="legend" class="legend" aria-label="Contributors" hidden></aside>
    <p id="commit-caption" class="commit-caption" aria-live="polite" hidden></p>
    <div id="postcard" class="postcard" hidden></div>
    <div id="player" hidden>
      <div class="controls">
        <button id="back" type="button">Play backwards</button>
        <button id="play" type="button">Play</button>
        <button id="latest" type="button">Jump to latest</button>
        <span class="readout"><span id="date"></span> · <span id="count"></span></span>
        <span id="caption" class="caption"></span>
        <button id="mode-real" type="button" aria-pressed="true">Real time</button>
        <button id="mode-commit" type="button" aria-pressed="false">Per commit</button>
        <button id="follow" type="button" aria-pressed="true">Follow changes: on</button>
        <span id="speeds" class="speeds"></span>
      </div>
      <div id="track" class="track">
        <canvas id="ribbon" aria-hidden="true"></canvas>
        <input id="scrubber" type="range" min="0" max="10000" value="0" aria-label="Position in history" />
        <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      </div>
      <span id="status" class="status" aria-live="polite"></span>
    </div>
    <script type="module" src="%PAGE_SCRIPT%"></script>
  </body>
</html>
