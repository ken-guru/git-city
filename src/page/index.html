<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitCity</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #e9eef2;
        --fg: #1d2630;
        --panel: rgba(255, 255, 255, 0.85);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10161c;
          --fg: #dde5ec;
          --panel: rgba(24, 32, 40, 0.85);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #player {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--panel);
      }
      #player button {
        font: inherit;
        min-width: 4.5em;
        padding: 4px 10px;
        cursor: pointer;
      }
      #notice {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      #notice code {
        user-select: all;
      }
      .labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .district-label {
        padding: 2px 8px;
        border-left: 4px solid;
        border-radius: 4px;
        background: var(--panel);
        white-space: nowrap;
        transform: translate(-50%, -100%);
      }
      .district-label small {
        display: block;
        opacity: 0.7;
        font-size: 11px;
      }
      .legend {
        position: fixed;
        top: 16px;
        right: 16px;
        display: grid;
        gap: 4px;
        max-width: min(260px, calc(100vw - 32px));
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel);
      }
      .legend-entry {
        display: flex;
        gap: 8px;
        align-items: center;
        font: inherit;
        text-align: left;
        background: none;
        border: 0;
        padding: 2px 0;
        color: inherit;
        cursor: pointer;
      }
      .legend-entry[aria-pressed="true"] {
        font-weight: 600;
      }
      .legend-entry .swatch {
        flex: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .legend-more {
        margin: 0;
        opacity: 0.7;
      }
      .caption {
        position: fixed;
        left: 16px;
        bottom: 64px;
        max-width: calc(100vw - 32px);
        margin: 0;
        padding: 4px 10px;
        border-radius: 6px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="notice" hidden></div>
    <aside id="legend" class="legend" aria-label="Contributors" hidden></aside>
    <p id="caption" class="caption" aria-live="polite" hidden></p>
    <div id="player" hidden>
      <button id="play" type="button">Play</button>
      <span id="status" aria-live="polite"></span>
    </div>
    <script type="module" src="%PAGE_SCRIPT%"></script>
  </body>
</html>
